name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  pack-publish:
    name: pack + push to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history to compute the tag-driven version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore dotnet-openehr-sdk.slnx

      - name: Build
        run: dotnet build dotnet-openehr-sdk.slnx -c Release --no-restore

      - name: Test
        run: dotnet test dotnet-openehr-sdk.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack dotnet-openehr-sdk.slnx -c Release --no-build -o ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.GINOC_NUGET }}
        run: |
          if [ -z "$GINOC_NUGET" ]; then
            echo "::error::GINOC_NUGET secret is not set"
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$GINOC_NUGET" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
