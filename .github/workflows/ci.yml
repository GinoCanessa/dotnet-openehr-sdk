name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build + test
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: dotnet --info
        run: dotnet --info

      - name: Restore
        run: dotnet restore dotnet-openehr-sdk.slnx

      - name: Build
        run: dotnet build dotnet-openehr-sdk.slnx -c Release --no-restore

      - name: Test
        run: dotnet test dotnet-openehr-sdk.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

  aot-smoke:
    name: AOT smoke (${{ matrix.rid }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish AOT smoke
        shell: pwsh
        run: |
          dotnet publish tests/DotnetOpenEhr.AotSmoke `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:PublishAot=true `
            -p:TreatWarningsAsErrors=true `
            --self-contained true

      - name: Run AOT smoke binary (linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          binary="tests/DotnetOpenEhr.AotSmoke/bin/Release/net10.0/${{ matrix.rid }}/publish/DotnetOpenEhr.AotSmoke"
          chmod +x "$binary"
          output="$($binary)"
          echo "smoke output: $output"
          if [ "$output" != "smoke ok" ]; then
            echo "::error::smoke binary did not print expected banner"
            exit 1
          fi

      - name: Run AOT smoke binary (windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $binary = "tests/DotnetOpenEhr.AotSmoke/bin/Release/net10.0/${{ matrix.rid }}/publish/DotnetOpenEhr.AotSmoke.exe"
          $output = & $binary
          Write-Host "smoke output: $output"
          if ($output -ne "smoke ok") {
            Write-Error "smoke binary did not print expected banner"
            exit 1
          }
